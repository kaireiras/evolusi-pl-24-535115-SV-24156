services:
  # 1. Basis Data MySQL
  db:
    image: mysql:8.0
    container_name: suratsurga_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sus_database}
      MYSQL_USER: ${DB_USERNAME:-rakai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahasia123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - suratsurga_network

  # 2. Backend Laravel (context: . karena berada langsung di root)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suratsurga_backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-sus_database}
      DB_USERNAME: ${DB_USERNAME:-rakai}
      DB_PASSWORD: ${DB_PASSWORD:-rahasia123}
    ports:
      - "8000:8000"
    networks:
      - suratsurga_network

  # 3. Frontend Vue.js (context: ./frontend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: suratsurga_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - suratsurga_network

# Named volume untuk database
volumes:
  db_data:
    driver: local

# Bridge network internal
networks:
  suratsurga_network:
    driver: bridge
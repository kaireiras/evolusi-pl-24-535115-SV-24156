name: Deploy

on:
  push:
    branches: ["**"]        # semua branch -> build & test tetap jalan
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Pasang dependensi produksi
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Simpan vendor sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: rilis
          path: vendor/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository    # tiap job mulai dari mesin kosong
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Pasang dependensi (termasuk paket dev)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan file environment
        run: cp .env.example .env

      - name: Buat application key
        run: php artisan key:generate

      - name: Periksa gaya kode (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Jalankan test suite
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke staging (simulasi)
        run: echo "Deploy ke server staging (simulasi) untuk commit ${{ github.sha }}"

  production:
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'    # penjaga: hanya dari main
    runs-on: ubuntu-latest
    environment: production                                                # butuh persetujuan reviewer
    steps:
      - name: Jalankan langkah deploy.sh (simulasi)
        run: |
          echo "[1/7] php artisan down --retry=60"
          echo "[2/7] git pull origin main"
          echo "[3/7] composer install --no-dev --optimize-autoloader"
          echo "[4/7] php artisan migrate --force"
          echo "[5/7] php artisan config:cache && php artisan route:cache && php artisan view:cache"
          echo "[6/7] php artisan queue:restart"
          echo "[7/7] php artisan up"
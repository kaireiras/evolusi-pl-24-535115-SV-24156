name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Berikan izin menulis ke GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: Backend Tests
  # ==========================================
  backend-tests:
    name: Backend Feature Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sus_database
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath
      - run: composer install --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Run Database Seeder
        run: php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root

  # ==========================================
  # JOB 2: Frontend Build
  # ==========================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # =======================================================
  # JOB 3: Deploy & Publish Image to GHCR
  # =======================================================
  deploy-and-publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    # Berjalan di push main ATAU push dev (setelah PR di-merge)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        run: |
          echo "IMAGE_REPO=ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      # Menentukan tag: jika push ke main jadi latest, jika push ke dev jadi dev
      - name: Set Image Tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DOCKER_TAG=latest" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}-backend:${{ env.DOCKER_TAG }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}-frontend:${{ env.DOCKER_TAG }}

      - name: Trigger Server Deployment
        run: |
          echo "Connecting to target deployment environment..."
          echo "Target host secret: ${{ secrets.SERVER_HOST || 'production-server' }}"
          echo "Branch target: ${{ github.ref_name }}"
          echo "Images successfully published to GHCR. Deployment completed."
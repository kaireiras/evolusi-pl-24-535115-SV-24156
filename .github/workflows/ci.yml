name: CI/CD Pipeline

on:
  push:
    branches: [ "main, dev" ]
  pull_request:
    branches: [ "main, dev" ]

# Berikan izin menulis ke GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # JOB 1: Backend Tests
  # ==========================================
  backend-tests:
    name: Backend Feature Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sus_database
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath
      - run: composer install --prefer-dist --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sus_database
          DB_USERNAME: root
          DB_PASSWORD: root

  # ==========================================
  # JOB 2: Frontend Build
  # ==========================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # =======================================================
  # JOB 3: Deploy & Publish Image to GHCR (Memenuhi Soal)
  # =======================================================
  deploy-and-publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    # Hanya jalan jika backend test & frontend build sukses, dan hanya di branch main
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login ke GitHub Container Registry menggunakan GITHUB_TOKEN bawaan
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konversi nama repository ke lowercase agar sesuai standar docker image naming
      - name: Downcase Repository Name
        run: |
          echo "IMAGE_REPO=ghcr.io/${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      # Build dan Push Backend Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/backend:latest

      # Build dan Push Frontend Image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/frontend:latest

      # Simulasi Step Deploy Menggunakan GitHub Secret
      - name: Trigger Server Deployment
        run: |
          echo "Connecting to target deployment environment..."
          echo "Target host secret: ${{ secrets.SERVER_HOST || 'production-server' }}"
          echo "Images successfully published to GHCR. Deployment completed."